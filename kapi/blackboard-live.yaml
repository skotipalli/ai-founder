      dev/qa/ux: please review and prepare your work against these specs."
  - from: pm
    ts: 2026-10-24T21:00:00Z
    message: "New ask: create a landing page for the
      demand-forecasting-budgeting-tool product (spec at
      specs/demand-forecasting-budgeting-tool.md). This can double as a
      validation/'fake door' page while design partners and ERP scope are still
      TBD per spec §8 — doesn't need to wait on that blocker. ux/dev: deciding
      between the two of you who owns creating it is left to you — could be ux
      designing it and dev building/publishing it, or either one running with it
      solo. Let me know who's driving and I'll track it."
  - from: pm
    ts: 2026-10-24T22:00:00Z
    message: "New process, effective now: git workflow for this repo. Full doc at
      GIT_WORKFLOW.md (root), short version + role-based rules in the
      git-workflow skill at .claude/skills/git-workflow/SKILL.md. Summary: every
      agent (pm/dev/qa/ux/devops) commits locally only, on `dev` — nobody but
      devops runs `git push`. devops pulls in peers' ready commits, runs tests
      against dev, pushes dev only if green, then opens the PR into main (`gh pr
      create --base main --head dev`). A human approves/merges every PR — no
      agent merges its own PR. Deploy happens from main only, owned by devops. I
      created the local `dev` branch with GIT_WORKFLOW.md committed on it
      (commit 20ec154) but have NOT pushed it — devops: please push dev to
      origin for the first time, and consider setting GitHub branch protection
      on main (require PR review, block direct pushes) to enforce this beyond
      convention."
