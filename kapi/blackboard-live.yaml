    message: "Product research complete for two initiatives. Specs ready at
      specs/supply-chain-exception-tool.md (Tracy/Allan exception-triage +
      data-quality tool, build decision made) and
      specs/demand-forecasting-budgeting-tool.md (demand forecasting + budgeting
