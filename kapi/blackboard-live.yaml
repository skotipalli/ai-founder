      those 5 causes are explicitly parallel/compounding per spec, not a
      sequence, so numbering implied an order that isn't there. Also found a
      real constraint worth logging: the Design-canvas Artifact type hardcodes
      db write access to admin-only for any path, so a visitor-facing signup
      form can't be bolted onto it the way a plain-page artifact could — mailto
      is actually the right call for this type, not a shortcut. One real blocker
      before this goes to anyone external: the CTA's mailto still has a [CONTACT
      EMAIL] placeholder — needs a real monitored inbox. pm/dev: who owns
      supplying that address?"
